projects:
  - title: "Offline PDF Chatbot & Summariser"
    summary: >-
      Upload PDF documents, ask questions about them and get concise summaries - entirely offline. Text is
      extracted and split into sections, the most relevant passages are retrieved for each question (RAG), and a
      local language model writes the answer. No internet access or API keys needed, which suits sensitive
      documents.
    image: "/assets/img/pdf-chatbot.webp"   # optimised copy (original: github.com/user-attachments/assets/519c4bfb-0a8a-43f1-b731-6792e56d78fa)
    image_alt: "Diagram of the offline PDF chatbot: PDF upload, retrieval and a local language model"
    tags: ["Python", "RAG", "Local LLM", "Document processing"]
    link: "https://github.com/Michael-S777/Offline-RAG-PDF-chatbot-summarizer"
    link_label: "Code on GitHub"
  - title: "Student Performance Analytics Pipeline"
    summary: >-
      End-to-end analytics engineering pipeline modelling student performance through staging, intermediate and
      mart layers. Produces a student dimension with academic standing (High Distinction to At Risk) and an
      enrolments fact table, applying Australian grading standards and weighted assessments. Data quality is
      enforced by automated tests, with CI on every push, SQLFluff linting and pre-commit hooks.
    image: "/assets/img/student-analytics.webp"   # optimised copy (original: github.com/user-attachments/assets/7ed604df-385d-46c9-9778-290848154609)
    image_alt: "Student performance analytics pipeline from raw CSV files to business-ready tables"
    tags: ["dbt Core", "DuckDB", "Python", "SQL", "GitHub Actions", "SQLFluff"]
    link: "https://github.com/Michael-S777/student-performance-analytics"
    link_label: "Code on GitHub"
  - title: "AI Data Engineer Librarian"
    summary: >-
      A governed document library that makes AI systems more trustworthy. Business documents carry metadata
      (source, owner, version, trust level), are validated against rules, split into searchable chunks and
      retrieved with full lineage back to the original document.
    image: "/assets/img/ai-librarian.webp"   # optimised copy (original: github.com/user-attachments/assets/9cf76e7a-dbb8-4a65-97c1-151247144e38)
    image_alt: "Document library workflow: validation, chunking, retrieval and lineage"
    tags: ["Python", "Data governance", "Metadata", "Retrieval"]
    link: "https://github.com/Michael-S777/ai-data-engineer-librarian-project"
    link_label: "Code on GitHub"
  - title: "Local AI Downloads Organiser"
    summary: >-
      Automatically organises a Downloads folder with a hybrid approach: extension and keyword rules first, and a
      locally hosted language model (via Ollama) for ambiguous files. Includes a dry-run preview, safe file
      handling that never overwrites, and a detailed action log - fully offline.
    image: "/assets/img/downloads-organiser.webp"   # optimised copy (original: github.com/user-attachments/assets/327104b2-4b18-4692-b75b-5110e00b955f)
    image_alt: "Local AI Downloads Organiser sorting files into folders"
    tags: ["Python", "Ollama", "Local LLM", "Automation"]
    link: "https://github.com/Michael-S777/local-ai-downloads-organizer"
    link_label: "Code on GitHub"
  - title: "Object Detection with YOLOv5"
    summary: >-
      Detects and labels objects in images using a YOLOv5 model pre-trained on the COCO dataset, run in Google
      Colab.
    image: "/assets/img/yolov5.webp"   # optimised copy (original: github.com/user-attachments/assets/b20e94b6-a5fd-4a14-917c-a63c9fca95d1)
    image_alt: "YOLOv5 detection output: two cars labelled with confidence scores on a busy street"
    tags: ["Python", "PyTorch", "YOLOv5", "Computer vision"]
    link: "https://colab.research.google.com/drive/1KofFAbshpSBXIBzMqzypi5oUWELDD59S?usp=sharing"
    link_label: "Notebook on Colab"
  - title: "Wine Quality Prediction"
    summary: >-
      Predicts wine quality from chemical and physical characteristics: exploratory analysis, cleaning and
      scaling, then several machine learning models compared using Mean Squared Error and R-squared.
    image: "/assets/img/wine-quality.webp"   # optimised copy (original: github.com/user-attachments/assets/54453745-32c9-4394-9a9e-281cc08b5ff8)
    image_alt: "Wine bottles and glasses illustrating the wine quality analysis"
    tags: ["Python", "Machine learning", "Regression", "EDA"]
    link: "https://colab.research.google.com/drive/1icNFHcw1B6Mwi_rgaKRt2QNT6_7mUJWS?usp=sharing"
    link_label: "Notebook on Colab"

